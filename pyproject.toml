[project]
name = "local-storage-exporter"
version = "0.1.0"
description = "Metric exporter for kubernetes storage classes that use host path"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "idna>=3.15",
    "kubernetes==36.0.1",
    "prometheus-client==0.25.0",
    "pyasn1>=0.6.3",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "kubernetes-typed==18.20.2",
]
